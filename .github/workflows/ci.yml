name: CI Workflow

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-dummy-key' }}
          GEMINI_MODEL: 'gemini-3.6-flash'
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY || 'ci-dummy-key' }}
          VITE_GEMINI_MODEL: 'gemini-3.6-flash'
        run: npm run build