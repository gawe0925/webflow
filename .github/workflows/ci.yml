name: CI Workflow

# 觸發條件：當有人 push 或開 PR 到 develop 或 main 分支時自動執行
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. 檢出程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Node.js 環境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-[version](https://www.google.com/search?q=version): '20'
          cache: 'npm'

      # 3. 安裝依賴套件
      - name: Install dependencies
        run: npm ci

      # 4. 檢查 TypeScript 型別 (防止型別錯誤被推上線)
      - name: Type check
        run: npx tsc --noEmit

      # 5. 測試專案 Build 打包 (確保 Vite 打包不會掛掉)
      - name: Build project
        env:
          # 傳入假的環境變數讓 CI 打包時不會因為缺少變數而跳錯
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY || 'ci-placeholder-key' }}
          VITE_GEMINI_MODEL: 'gemini-3.6-flash'
        run: npm run build